name: star-history

on:
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'Scripts/star-history.mjs'
      - '.github/workflows/star-history.yml'

permissions:
  contents: write

concurrency:
  group: star-history
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Render star history
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node Scripts/star-history.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- assets/star-history.svg assets/star-history-dark.svg; then
            echo "no change"
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/star-history.svg assets/star-history-dark.svg
          git commit -m 'chore: refresh star history'
          git push
