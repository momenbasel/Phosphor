name: Windows

on:
  push:
    branches: [main]
    paths: ['windows/**', 'Resources/AppIcon.icns', '.github/workflows/windows.yml']
  pull_request:
    branches: [main]
    paths: ['windows/**', 'Resources/AppIcon.icns', '.github/workflows/windows.yml']

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64

      - name: Install Dependencies
        run: |
          python -m pip install -r requirements.lock.txt black

      - name: Check Formatting
        run: python -m black --check backend tests scripts

      - name: Engine Regression Tests
        run: python -m pytest tests -q -p no:cacheprovider

      - name: Engine Smoke Test
        run: python scripts/smoke-engine.py
